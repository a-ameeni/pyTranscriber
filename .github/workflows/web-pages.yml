name: Publish pyTranscriber Web

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pytranscriber-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static web app
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
